      DATABASE_URL: postgresql://atelier:atelier_local_dev@postgres:5432/atelier
      ATELIER_INTERNAL_SERVICE_TOKEN: ${ATELIER_INTERNAL_SERVICE_TOKEN:-dev-only-internal-token}
