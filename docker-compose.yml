      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: artist-artwork-service
    environment:
      ARTIST_ARTWORK_PORT: 4103
      DATABASE_URL: postgresql://atelier:atelier_local_dev@postgres:5432/atelier
      ATELIER_INTERNAL_SERVICE_TOKEN: ${ATELIER_INTERNAL_SERVICE_TOKEN:-dev-only-internal-token}
    ports: ["4103:4103"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4103/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    depends_on:
      postgres: { condition: service_healthy }

  commerce-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: commerce-service
    environment:
      COMMERCE_PORT: 4104
      DATABASE_URL: postgresql://atelier:atelier_local_dev@postgres:5432/atelier
      ATELIER_INTERNAL_SERVICE_TOKEN: ${ATELIER_INTERNAL_SERVICE_TOKEN:-dev-only-internal-token}
    ports: ["4104:4104"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4104/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    depends_on:
      postgres: { condition: service_healthy }

  recommendation-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: recommendation-service
    environment:
      RECOMMENDATION_PORT: 4105
      DATABASE_URL: postgresql://atelier:atelier_local_dev@postgres:5432/atelier
      ARTIST_ARTWORK_SERVICE_URL: http://artist-artwork-service:4103
      ATELIER_INTERNAL_SERVICE_TOKEN: ${ATELIER_INTERNAL_SERVICE_TOKEN:-dev-only-internal-token}
    ports: ["4105:4105"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4105/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    depends_on:
      postgres: { condition: service_healthy }
