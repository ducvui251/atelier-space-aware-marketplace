services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atelier
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: atelier_local_dev
    ports: ["5432:5432"]
    volumes:
      - atelier-postgres-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier"]
      interval: 5s
      timeout: 5s
      retries: 10

  account-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: account-service
    environment:
      ACCOUNT_PORT: 4101
      DATABASE_URL: postgresql://atelier:atelier_local_dev@postgres:5432/atelier
      ATELIER_INTERNAL_SERVICE_TOKEN: ${ATELIER_INTERNAL_SERVICE_TOKEN:-dev-only-internal-token}
    ports: ["4101:4101"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4101/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    depends_on:
      postgres: { condition: service_healthy }

  catalog-discovery-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE_NAME: catalog-discovery-service
    environment:
      CATALOG_DISCOVERY_PORT: 4102
      DATABASE_URL: postgresql://atelier:atelier_local_dev@postgres:5432/atelier
      ARTIST_ARTWORK_SERVICE_URL: http://artist-artwork-service:4103
      ATELIER_INTERNAL_SERVICE_TOKEN: ${ATELIER_INTERNAL_SERVICE_TOKEN:-dev-only-internal-token}
    ports: ["4102:4102"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4102/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    depends_on:
      postgres: { condition: service_healthy }
      artist-artwork-service: { condition: service_healthy }

  artist-artwork-service:
