name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

jobs:
  validate:
    name: Type-check, lint, contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Contract tests
        run: pnpm --filter @atelier/contracts test

      - name: Boundary grep gates
        # Anti-recurrence gates from MICROSERVICE_100_PLAN.md Phase 0:
        # 1. picsum placeholder imagery is banned from production source
        #    (the idempotent rewrite statements in migration 0011 are the
        #    one allowed exception — they match only legacy picsum URLs).
        # 2. ATELIER_INTERNAL_SERVICE_TOKEN must never have a working
        #    (:-) default in compose files — it must fail closed.
        # 3. Every runbooks/*.md referenced by tracked files must exist.
        # 4. ATELIER_ALLOW_INSECURE_LOCAL (the auth bypass for running a
        #    single service directly on the host) must never be set in any
        #    compose file — Compose always runs with real internal auth.
        run: |
          failed=0
          if grep -RIn "picsum" apps/web-gateway/src services/*/src supabase/migrations --include='*.ts' --include='*.tsx' --include='*.sql' \
             | grep -v '0011_catalog_collections.sql'; then
            echo "::error::picsum placeholder imagery found in production source (ADR 0001 D7)"
            failed=1
          fi
          if grep -RInE 'ATELIER_INTERNAL_SERVICE_TOKEN[^}]*:-' docker-compose.yml docker-compose.*.yml .docker-compose*.yml 2>/dev/null; then
            echo "::error::working default for ATELIER_INTERNAL_SERVICE_TOKEN in compose (G-18)"
            failed=1
          fi
          if grep -RIn 'ATELIER_ALLOW_INSECURE_LOCAL' docker-compose.yml docker-compose.*.yml .docker-compose*.yml 2>/dev/null; then
            echo "::error::ATELIER_ALLOW_INSECURE_LOCAL must never appear in a compose file"
            failed=1
          fi
          for ref in $(grep -RhoE 'runbooks/[a-z0-9-]+\.md' --include='*.yml' --include='*.md' --include='*.example' .github .env.example runbooks apps services scripts docs 2>/dev/null | sort -u); do
            if [ ! -f "$ref" ]; then
              echo "::error::referenced runbook does not exist: $ref"
              failed=1
            fi
          done
          exit $failed

  compose-smoke:
    name: Compose config + service startup smoke test
    runs-on: ubuntu-latest
    needs: validate
    env:
      # Shared by every step in this job — must match between the "Start
      # the stack" step (bakes it into the running services) and
      # "Smoke-test" (sends it as x-service-token); a mismatch here is
      # exactly what caused the 401s that failed this job before.
      ATELIER_INTERNAL_SERVICE_TOKEN: ci-smoke-test-token
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose config
        # ATELIER_INTERNAL_SERVICE_TOKEN is a job-level env var (above);
        # compose interpolates it as ${VAR:?required} and fails closed
        # when missing (G-18 hardening).
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Install Trivy
        # Pinned direct download instead of the convenience install.sh
        # script — that script calls the GitHub API to resolve the tag,
        # which both drifts (v0.56.2 stopped existing) and can hit
        # unauthenticated rate limits. Bump TRIVY_VERSION deliberately.
        env:
          TRIVY_VERSION: "0.74.0"
        run: |
          curl -sL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: Scan built images for known vulnerabilities
        # Report-only: base images we don't control (postgres, rabbitmq) can
        # carry upstream CRITICAL/HIGH CVEs with no fix available yet, and
        # gating CI on those would just make the pipeline permanently red.
        # Findings are printed to the log for a human to triage.
        run: |
          for image in $(docker compose config --images); do
            echo "::group::trivy $image"
            trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 "$image"
            echo "::endgroup::"
          done

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for every service to report healthy
        run: bash scripts/wait-for-healthy.sh

      - name: Smoke-test health and readiness endpoints
        run: bash scripts/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to demo host
    # Manual only — this runs on the demo machine itself (self-hosted
    # runner) and restarts the live stack behind the Cloudflare Tunnel, so
    # it must never fire on an ordinary push/PR. Trigger it from the
    # Actions tab ("Run workflow") only when you deliberately want to
    # redeploy. See runbooks/deployment.md.
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    needs: [validate, compose-smoke]
    steps:
      - name: Pull latest and rebuild
        working-directory: D:\DATN
        shell: bash
        run: |
          git pull
          docker compose build

      - name: Restart the stack
        working-directory: D:\DATN
        shell: bash
        run: docker compose up -d

      - name: Wait for every service to report healthy
        working-directory: D:\DATN
        shell: bash
        run: bash scripts/wait-for-healthy.sh

      - name: Smoke-test health and readiness endpoints
        working-directory: D:\DATN
        shell: bash
        run: |
          export ATELIER_INTERNAL_SERVICE_TOKEN=$(grep ATELIER_INTERNAL_SERVICE_TOKEN .env | cut -d= -f2)
          bash scripts/smoke-test.sh
